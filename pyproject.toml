[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parlasoul-backend"
version = "0.1.0"
description = "ParlaSoul FastAPI backend service"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "ParlaSoul contributors" }]
keywords = ["fastapi", "ai-characters", "chat", "webrtc", "llm", "milvus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "PyJWT[crypto]>=2.10.1",
  "python-jose[cryptography]>=3.4.0",
  "email-validator>=2.2.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "aiosmtplib>=3.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "anyio>=4.8.0",
  "websockets>=14.2",
  "aiortc>=1.9.0",
  "numpy>=1.26,<2",
  "onnxruntime>=1.20.0",
  "openai>=2.29.0",
  "pydantic-ai-slim[openai]>=1.79.0",
  "openrouter>=0.7.11",
  "pymilvus>=2.5.0",
  "anthropic>=0.40.0",
  "boto3>=1.35.0",
  "pillow>=12.0.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
observability = [
  "langfuse>=3.0.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "pre-commit>=4.1.0",
]

[project.urls]
Homepage = "https://parlasoul.com"
Repository = "https://github.com/ChasePassion/parlasoul-backend"
Issues = "https://github.com/ChasePassion/parlasoul-backend/issues"

[tool.setuptools.package-data]
"src.services.forge_skills" = ["*/SKILL.md", "*/system_prompt_template_*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
